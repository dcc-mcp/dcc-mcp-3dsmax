tools:
  - name: execute_python
    description: >-
      Execute explicit Python code inside the current 3ds Max session with
      pymxs, rt, and runtime pre-bound. Use only when typed tools cannot
      express the requested operation.
    source_file: action_execute_python.py
    execution: sync
    affinity: main
    timeout_hint_secs: 10
    input_schema:
      type: object
      required: [code, confirm_execution]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          description: Python statements to execute on the 3ds Max main thread.
        confirm_execution:
          type: boolean
          const: true
          description: Must be true to acknowledge arbitrary Python execution.
        expression:
          type: string
          minLength: 1
          description: Optional Python expression to evaluate after code runs.
    output_schema:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        status:
          type: string
        message:
          type: string
        data:
          type: object
    read_only: false
    destructive: true
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: true

    intent: "Execute explicit Python code inside the 3ds Max session with pymxs pre-bound."
    tool_role: escape_hatch
    risk: host_script_execution
    search_aliases: ["execute_python", "execute python", "execute python"]
    side_effects:
      creates: false
      modifies: true
      deletes: false
      exports: false
      imports: false
      file_output: false
      render: false
      targets: []
    produces: ['script_result']
    undo:
      supported: true
      granularity: script_defined
      notes: >-
        Undo coverage depends on the script body and cannot be verified by the adapter; prefer typed tools.

  - name: execute_maxscript
