    affinity: main
    timeout_hint_secs: 10
    input_schema:
      type: object
      required: [script, confirm_execution]
      additionalProperties: false
      properties:
        script:
          type: string
          minLength: 1
          description: MaxScript code to execute on the 3ds Max main thread.
        confirm_execution:
          type: boolean
          const: true
          description: Must be true to acknowledge arbitrary MaxScript execution.
    output_schema:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        status:
          type: string
        message:
          type: string
        data:
          type: object
    read_only: false
    destructive: true
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: true

    intent: "Execute explicit MaxScript code in the 3ds Max session."
    tool_role: escape_hatch
    risk: host_script_execution
    search_aliases: ["execute_maxscript", "execute maxscript", "execute maxscript"]
    side_effects:
      creates: false
      modifies: true
      deletes: false
      exports: false
      imports: false
      file_output: false
      render: false
      targets: []
    produces: ['script_result']
    undo:
      supported: true
      granularity: script_defined
      notes: >-
        Undo coverage depends on the script body and cannot be verified by the adapter; prefer typed tools.

