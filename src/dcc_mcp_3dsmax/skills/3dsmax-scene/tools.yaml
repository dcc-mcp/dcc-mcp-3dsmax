  - name: merge_from_file
    description: >-
      Merge objects selected by exact name or by name pattern from an external
      .max file into the current scene, using fixed no-prompt duplicate,
      material, and reparent policies. The selection is resolved against the
      source file first: an unmatched name or pattern fails the call instead of
      merging an arbitrary subset, and unresolved names are always reported.
    source_file: action_merge_from_file.py
    execution: async
    job_strategy: monolithic
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      additionalProperties: false
      required: [file_path]
      properties:
        file_path:
          type: string
          minLength: 1
          maxLength: 4096
          description: Existing absolute .max source path.
        object_names:
          type: array
          minItems: 1
          maxItems: 1000
          items: {type: string, minLength: 1, maxLength: 256}
          description: >-
            Exact source object names to merge. Mutually exclusive with
            name_pattern; omit both to merge every object in the file.
        name_pattern:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            Substring or glob pattern selecting the source objects to merge.
            Mutually exclusive with object_names.
        match_mode:
          type: string
          enum: [contains, glob]
          default: contains
          description: Match source object names by substring or by glob wildcard.
        case_sensitive:
          type: boolean
          default: false
          description: Match source object names case-sensitively when true.
        require_all:
          type: boolean
          default: false
          description: >-
            Fail without merging when any requested object name is missing from
            the source file.
        duplicate_names:
          type: string
          enum: [rename, skip, merge]
          default: rename
        material_duplicates:
          type: string
          enum: [rename, use_scene, use_merged]
          default: rename
        reparent:
          type: string
          enum: [never, always]
          default: never
        select_merged:
          type: boolean
          default: false
    output_schema:
      type: object
      additionalProperties: true
      properties:
        success: {type: boolean}
        message: {type: string}
        data: {type: object}
    timeout_hint_secs: 120
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    intent: "Merge named or pattern-matched objects from one 3ds Max file."
    tool_role: action
    risk: medium
    search_aliases: ["merge_from_file", "merge objects from max file", "merge max objects"]
    side_effects:
      creates: true
      modifies: true
      deletes: false
      exports: false
      imports: true
      file_output: false
      render: false
      targets: ["scene_nodes"]
    produces: ["scene_nodes", "scene_status"]
    undo:
      supported: true
      granularity: batch_call
      notes: >-
        Merges N nodes in one call. Undo once and re-check the node list; repeat while merged
