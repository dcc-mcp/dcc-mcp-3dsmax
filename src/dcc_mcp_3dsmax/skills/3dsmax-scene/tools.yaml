      granularity: none
      notes: >-
        File > New resets the scene and clears the 3ds Max history stack; save the scene before calling it.

  - name: open_scene
    description: >-
      Open an existing absolute .max file without dialogs. A dirty scene is
      rejected unless force is true.
    source_file: action_open_scene.py
    execution: async
    job_strategy: monolithic
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      additionalProperties: false
      required: [file_path]
      properties:
        file_path:
          type: string
          minLength: 1
          maxLength: 4096
          description: Existing absolute .max scene path.
        force:
          type: boolean
          default: false
          description: Explicitly discard unsaved current-scene changes.
    output_schema:
      type: object
      additionalProperties: true
      properties:
        success: {type: boolean}
        message: {type: string}
        data: {type: object}
    timeout_hint_secs: 120
