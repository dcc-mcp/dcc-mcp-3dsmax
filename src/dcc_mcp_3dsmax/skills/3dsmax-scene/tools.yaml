  - name: merge_file
    description: >-
      Merge all or selected nodes from an absolute .max file using fixed,
      no-prompt duplicate, material, and reparent policies.
    source_file: action_merge_file.py
    execution: async
    job_strategy: monolithic
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      additionalProperties: false
      required: [file_path]
      properties:
        file_path:
          type: string
          minLength: 1
          maxLength: 4096
          description: Existing absolute .max source path.
        node_names:
          type: array
          minItems: 1
          maxItems: 1000
          items: {type: string, minLength: 1, maxLength: 256}
          description: Optional exact source node names; omit to merge all nodes.
        duplicate_names:
          type: string
          enum: [rename, skip, merge]
          default: rename
        material_duplicates:
          type: string
          enum: [rename, use_scene, use_merged]
          default: rename
        reparent:
          type: string
          enum: [never, always]
          default: never
        select_merged:
          type: boolean
          default: false
    output_schema:
      type: object
      additionalProperties: true
      properties:
        success: {type: boolean}
        message: {type: string}
        data: {type: object}
    timeout_hint_secs: 120
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
