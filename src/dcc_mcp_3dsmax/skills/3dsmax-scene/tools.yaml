    enforce_thread_affinity: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        force:
          type: boolean
          default: false
          description: Explicitly discard unsaved scene changes when true.
    output_schema:
      type: object
      additionalProperties: true
      properties:
        success: {type: boolean}
        message: {type: string}
        data: {type: object}
