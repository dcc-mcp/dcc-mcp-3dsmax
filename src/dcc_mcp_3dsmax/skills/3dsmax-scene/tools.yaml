    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        file_path:
          type: string
          minLength: 1
          maxLength: 4096
          description: Optional legacy absolute .max output path.
        overwrite:
          type: boolean
          default: false
          description: Allow replacement when the legacy file_path exists.
    output_schema:
      type: object
      additionalProperties: true
      properties:
        success: {type: boolean}
        message: {type: string}
        data: {type: object}
    timeout_hint_secs: 120
    read_only: false
    destructive: true
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
