    description: Capture the active viewport to an image file.
    source_file: action_capture_viewport.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      required: [output_path]
      additionalProperties: false
      properties:
        output_path: {type: string, minLength: 1}
        overwrite: {type: boolean, default: false}
    output_schema: &output_schema
      type: object
      additionalProperties: true
      properties:
        success: {type: boolean}
        status: {type: string}
        message: {type: string}
        data: {type: object}
    timeout_hint_secs: 60
    read_only: true
    destructive: false
    idempotent: true
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false}

    intent: "Capture the active viewport to an image file."
    tool_role: read_only
    risk: low
    search_aliases: ["capture_viewport", "capture viewport", "capture viewport"]
    side_effects:
