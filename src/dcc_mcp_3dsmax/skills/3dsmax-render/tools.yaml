  - name: render_hdr
    description: >-
      Render the current scene to an HDR/EXR/TIFF image file with configurable
      bit depth and compression. Use when the user wants high dynamic range
      output or EXR multi-channel save.
    source_file: action_render_hdr.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      required: [output_path]
      additionalProperties: false
      properties:
        output_path: {type: string, minLength: 1}
        overwrite: {type: boolean, default: false}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        camera_name: {type: string, minLength: 1}
        camera_handle: {type: integer}
        hdr_format: {type: string, enum: [exr, hdr, tif], default: exr}
        bit_depth: {type: integer, enum: [8, 16, 32], default: 16}
        compression: {type: string}
    output_schema:
      type: object
      additionalProperties: true
      properties:
        success: {type: boolean}
        status: {type: string}
        message: {type: string}
        data: {type: object}
