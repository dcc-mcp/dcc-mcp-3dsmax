name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: python -m ruff check src tests packaging --select E9,F63,F7,F82

      - name: Test with pytest
        run: python -m pytest

      - name: Install SOP lifecycle smoke
        run: python -m pytest tests/test_install_sop_cli.py

  core-latest:
    # The pinned upper bound keeps the main matrix reproducible, but it also
    # hides incompatibilities until a bump lands. This job deliberately runs
    # against the newest published Core -- including versions the pin excludes
    # -- so a Core minor that breaks the Install SOP contract shows up here
    # instead of silently landing in the main matrix.
    name: core-latest compatibility
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve newest Core
        id: core
        run: |
          python -m pip install --upgrade pip
          version=$(python -m pip index versions dcc-mcp-core \
            | tr ',' '\n' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved dcc-mcp-core ${version}"

      - name: Install adapter with newest Core
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install --upgrade "dcc-mcp-core==${{ steps.core.outputs.version }}"
          python -m pip show dcc-mcp-core

      - name: Install SOP contract against newest Core
        run: python -m pytest tests/test_install_sop_cli.py tests/test_feedback_dispatch.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: python -m twine check dist/*

  # ── Python 3.7 syntax gate ──────────────────────────────────────────────
  # 3ds Max 2022 embeds Python 3.7; pure-Python modules must remain
  # syntax-compatible with 3.7. This job runs check_py37_syntax.py with a
  # 3.7 interpreter to catch PEP 604 unions, walrus operators, and other
  # 3.8+ syntax.
  # Uses ubuntu-22.04 because Python 3.7 is no longer available in the
  # ubuntu-latest (24.04) hosted-tool cache.
  py37-syntax-check:
    name: py37 syntax check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"
      - name: Run py37 syntax check
        run: python scripts/check_py37_syntax.py

  build-mzp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MZP build dependencies
        run: python -m pip install "packaging>=21.3"

      - name: Resolve MZP version
        run: |
          $VERSION = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          Add-Content -Path $env:GITHUB_ENV -Value "MZP_VERSION=$VERSION"

      - name: Build drag-and-drop MZP
        run: python packaging/assemble_mzp.py --version $env:MZP_VERSION --output dist/mzp --project-root .

      - name: Smoke-check MZP payload imports
        run: |
          $mzp = Get-ChildItem dist/mzp/*.mzp | Select-Object -First 1
          python -I -S packaging/check_release_payload.py $mzp.FullName --expected-version $env:MZP_VERSION

      - name: Set up Python 3.7 for payload verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.7"
          architecture: "x64"

      - name: Smoke-check MZP payload with Python 3.7
        run: |
          $mzp = Get-ChildItem dist/mzp/*.mzp | Select-Object -First 1
          python -I -S packaging/check_release_payload.py $mzp.FullName --expected-version $env:MZP_VERSION

      - name: Upload MZP artifact
        uses: actions/upload-artifact@v4
        with:
          name: mzp
          path: dist/mzp/*.mzp
