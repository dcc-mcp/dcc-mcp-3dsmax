name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for manual MZP build (for example v0.1.0). Leave empty to only run release-please."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ inputs.tag_name && format('-{0}', inputs.tag_name) || '' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || inputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  resolve-release-ref:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.lock.outputs.release_commit }}
      release_tag: ${{ steps.select.outputs.release_tag }}
      release_version: ${{ steps.select.outputs.release_version }}
    steps:
      - name: Select release tag and version
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            version="${INPUT_TAG#v}"
          else
            tag="$RELEASE_TAG"
            version="$RELEASE_VERSION"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${tag#v}" = "$version"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.select.outputs.release_tag }}
          fetch-depth: 0

      - name: Lock immutable release commit
        id: lock
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.select.outputs.release_tag }}
        run: |
          commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$commit" = "$tag_commit"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "release_commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: [release-please, resolve-release-ref]
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release-ref.outputs.release_commit }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Run tests
        run: |
          python -m pip install ".[dev]"
          python -m pytest

      - name: Build wheel and sdist
        run: python -m build

      - name: Check package
        run: python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-3dsmax
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          print-hash: true

  build-mzp:
    needs: [release-please, resolve-release-ref]
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release-ref.outputs.release_commit }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MZP build dependencies
        run: python -m pip install "packaging>=21.3"

      - name: Resolve MZP version
        run: |
          $VERSION = "${{ needs.resolve-release-ref.outputs.release_version }}"
          Add-Content -Path $env:GITHUB_ENV -Value "MZP_VERSION=$VERSION"

      - name: Assemble drag-and-drop MZP
        run: python packaging/assemble_mzp.py --version $env:MZP_VERSION --output dist/mzp --project-root .

      - name: Smoke-check MZP payload imports
        run: |
          $mzp = Get-ChildItem dist/mzp/*.mzp | Select-Object -First 1
          python -I -S packaging/check_release_payload.py $mzp.FullName --expected-version $env:MZP_VERSION

      - name: Set up Python 3.7 for payload verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.7"
          architecture: "x64"

      - name: Smoke-check MZP payload with Python 3.7
        run: |
          $mzp = Get-ChildItem dist/mzp/*.mzp | Select-Object -First 1
          python -I -S packaging/check_release_payload.py $mzp.FullName --expected-version $env:MZP_VERSION

      - name: Upload MZP artifact
        uses: actions/upload-artifact@v4
        with:
          name: mzp
          path: dist/mzp/*.mzp

  attach-release-assets:
    needs: [release-please, resolve-release-ref, publish, build-mzp]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release-ref.outputs.release_commit }}
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download MZP artifacts
        uses: actions/download-artifact@v4
        with:
          name: mzp
          path: dist/mzp/

      - name: Attach assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python packaging/upload_release_assets.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "${{ needs.resolve-release-ref.outputs.release_tag }}" \
            --commit "${{ needs.resolve-release-ref.outputs.release_commit }}" \
            --asset-glob 'dist/*.whl' \
            --asset-glob 'dist/*.tar.gz' \
            --asset-glob 'dist/mzp/*.mzp'

  attach-manual-mzp:
    needs: [release-please, resolve-release-ref, build-mzp]
    if: github.event_name == 'workflow_dispatch' && inputs.tag_name != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release-ref.outputs.release_commit }}
          fetch-depth: 0

      - name: Download MZP artifacts
        uses: actions/download-artifact@v4
        with:
          name: mzp
          path: dist/mzp/

      - name: Attach MZP to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python packaging/upload_release_assets.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "${{ needs.resolve-release-ref.outputs.release_tag }}" \
            --commit "${{ needs.resolve-release-ref.outputs.release_commit }}" \
            --asset-glob 'dist/mzp/*.mzp'
